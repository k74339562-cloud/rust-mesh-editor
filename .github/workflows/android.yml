name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Blender Official Icons
        run: |
          mkdir -p assets/blender_icons
          BASE_URL="https://projects.blender.org/blender/blender/raw/branch/main/release/datafiles/icons"
          ICONS=(
            "ops.transform.translate.svg"
            "ops.transform.rotate.svg"
            "ops.transform.resize.svg"
            "ops.mesh.extrude_region.svg"
            "ops.mesh.loopcut_slide.svg"
            "ops.mesh.bevel.svg"
            "ops.mesh.inset.svg"
            "shading_wire.svg"
            "shading_solid.svg"
            "outliner_ob_mesh.svg"
            "outliner_ob_camera.svg"
            "outliner_ob_light.svg"
          )
          for icon in "${ICONS[@]}"; do
            curl -sSL "$BASE_URL/$icon" -o "assets/blender_icons/$icon" || true
          done

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34" "platforms;android-30"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=RustMeshEditor, OU=Dev, O=Dev, L=City, S=State, C=US"

      - name: Build Android APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          cargo apk build --release --target aarch64-linux-android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustMeshEditor-Alpha
          path: target/release/apk/*.apk
